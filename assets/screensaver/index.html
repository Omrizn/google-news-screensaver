<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google News Headlines</title>
<style>
  :root {
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.72);
    --faint: rgba(255, 255, 255, 0.18);
    --unit: min(1vw, 1.6vh);
  }
  @media (orientation: portrait) {
    :root { --unit: min(1.4vw, 1.1vh); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #07090d; color: var(--text);
    font-family: "Google Sans", "Roboto", "Heebo", "Noto Sans Hebrew", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .slide {
    position: absolute; inset: 0; overflow: hidden;
    opacity: 0; transition: opacity 1.4s ease;
    background: var(--base);
  }
  .slide.shown { opacity: 1; }
  /* Two soft glows in the slide's colours drift slowly while it shows. */
  .glow {
    position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%;
    filter: blur(6vmax); opacity: 0.55;
  }
  .glow.a { background: radial-gradient(circle, var(--a), transparent 62%); top: -45vmax; right: -30vmax; }
  .glow.b { background: radial-gradient(circle, var(--b), transparent 62%); bottom: -55vmax; left: -35vmax; opacity: 0.4; }
  .slide.shown .glow.a { animation: drift-a var(--duration, 12s) ease-in-out forwards; }
  .slide.shown .glow.b { animation: drift-b var(--duration, 12s) ease-in-out forwards; }
  @keyframes drift-a { to { transform: translate(-6vmax, 5vmax) scale(1.08); } }
  @keyframes drift-b { to { transform: translate(5vmax, -4vmax) scale(1.1); } }
  /* Headlines fill the space between the brand and the progress bars. The script sets --fit, the
     largest text scale at which every headline on the screen fits without being cut off. */
  .content {
    position: absolute;
    left: calc(var(--unit) * 5); right: calc(var(--unit) * 5);
    top: calc(var(--unit) * 13); bottom: calc(var(--unit) * 8);
    display: flex; flex-direction: column; justify-content: center; overflow: hidden;
  }
  @media (orientation: landscape) {
    .content { right: calc(var(--unit) * 14); max-width: 1500px; top: calc(var(--unit) * 12); bottom: calc(var(--unit) * 7); }
  }
  .item { display: flex; flex-direction: column; gap: calc(var(--unit) * 2.2 * var(--fit, 1)); min-width: 0; }
  .content.multi { justify-content: space-evenly; }
  .multi .item { gap: calc(var(--unit) * 1.3 * var(--fit, 1)); }
  .multi .item + .item { border-top: 1px solid var(--faint); padding-top: calc(var(--unit) * 3 * var(--fit, 1)); }
  .multi h1 { font-size: calc(var(--unit) * 4.6 * var(--fit, 1)); -webkit-line-clamp: 6; }
  .multi.n3 h1, .multi.n4 h1 { font-size: calc(var(--unit) * 3.9 * var(--fit, 1)); }
  .multi .outlet { font-size: calc(var(--unit) * 2 * var(--fit, 1)); }
  .multi .outlet img, .multi .outlet .initial { width: calc(var(--unit) * 3.6 * var(--fit, 1)); height: calc(var(--unit) * 3.6 * var(--fit, 1)); }
  .multi .meta { font-size: calc(var(--unit) * 1.5 * var(--fit, 1)); }
  .multi .coverage { font-size: calc(var(--unit) * 1.9 * var(--fit, 1)); -webkit-line-clamp: 2; }
  @media (orientation: landscape) {
    /* Side by side: two or three columns, or two by two. */
    .content.multi {
      right: calc(var(--unit) * 5); max-width: none;
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: space-evenly; column-gap: calc(var(--unit) * 5);
    }
    .content.multi.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .multi .item, .multi .item + .item { border-top: 1px solid var(--faint); padding-top: calc(var(--unit) * 2.5 * var(--fit, 1)); }
    .multi.n2 h1 { font-size: calc(var(--unit) * 4.2 * var(--fit, 1)); }
    .multi.n3 h1, .multi.n4 h1 { font-size: calc(var(--unit) * 3.4 * var(--fit, 1)); }
  }
  .outlet {
    display: flex; align-items: center; gap: calc(var(--unit) * 1.4);
    font-size: calc(var(--unit) * 2.3 * var(--fit, 1)); font-weight: 600;
  }
  .outlet img, .outlet .initial {
    width: calc(var(--unit) * 4.4 * var(--fit, 1)); height: calc(var(--unit) * 4.4 * var(--fit, 1));
    border-radius: calc(var(--unit) * 1); background: #fff; object-fit: contain;
    padding: calc(var(--unit) * 0.5); flex: none;
  }
  .outlet .initial {
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.16); color: var(--text); font-weight: 700; padding: 0;
  }
  .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--unit) * 1.2);
    font-size: calc(var(--unit) * 1.7 * var(--fit, 1)); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
  }
  .meta span + span::before { content: "\2022"; margin-right: calc(var(--unit) * 1.2); opacity: 0.6; }
  h1 {
    font-size: calc(var(--unit) * 6 * var(--fit, 1)); line-height: 1.12; font-weight: 700;
    letter-spacing: -0.015em;
    display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden;
    text-wrap: balance;
  }
  .coverage {
    font-size: calc(var(--unit) * 2.2 * var(--fit, 1)); line-height: 1.45; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    padding-left: calc(var(--unit) * 1.6); border-left: 3px solid var(--faint);
  }
  .coverage b { color: var(--text); font-weight: 500; }
  .top {
    position: absolute; top: calc(var(--unit) * 4); left: calc(var(--unit) * 5); right: calc(var(--unit) * 5);
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 2; pointer-events: none;
  }
  .brand {
    display: flex; align-items: center; gap: calc(var(--unit) * 1.2);
    font-size: calc(var(--unit) * 1.8); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .mark {
    display: inline-flex; flex-direction: column; justify-content: center; gap: 14%;
    width: calc(var(--unit) * 2.8); height: calc(var(--unit) * 2.8); padding: 0 calc(var(--unit) * 0.55);
    border-radius: 22%; background: rgba(255, 255, 255, 0.92);
  }
  .mark i { display: block; height: 11%; border-radius: 9px; background: #1d2433; }
  .mark i:nth-child(1) { width: 100%; }
  .mark i:nth-child(2) { width: 78%; }
  .mark i:nth-child(3) { width: 90%; }
  .brand small { font-weight: 400; color: var(--muted); letter-spacing: 0.06em; text-transform: none; }
  .clock { text-align: right; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4); }
  .clock .time { font-size: calc(var(--unit) * 5); font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  .clock .date { font-size: calc(var(--unit) * 1.7); color: var(--muted); margin-top: calc(var(--unit) * 0.6); }
  .progress {
    position: absolute; left: calc(var(--unit) * 5); right: calc(var(--unit) * 5); bottom: calc(var(--unit) * 3);
    display: flex; gap: calc(var(--unit) * 0.8); z-index: 2;
  }
  .progress div { flex: 1; height: 3px; border-radius: 3px; background: var(--faint); overflow: hidden; }
  .progress div i { display: block; height: 100%; width: 0; background: rgba(255, 255, 255, 0.85); }
  .progress div.done i { width: 100%; }
  .progress div.now i { animation: fill var(--duration, 12s) linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .notice {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: calc(var(--unit) * 2.4);
    font-size: calc(var(--unit) * 2.6); color: var(--muted); text-align: center; padding: 10%;
    background: radial-gradient(circle at 70% 20%, rgba(66, 103, 178, 0.35), transparent 60%), #0b0e14;
  }
  .notice .mark { width: calc(var(--unit) * 7); height: calc(var(--unit) * 7); padding: 0 calc(var(--unit) * 1.4); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  .stale { color: #ffb4a8; }

  /* Right-to-left editions such as Hebrew. The script sets dir="rtl" on the page. Flex rows then mirror
     by themselves: the brand moves to the right and the clock to the left. These rules mirror the
     parts that are positioned or padded by side, and drop letter spacing, which suits Latin capitals
     but not Hebrew. */
  html[dir="rtl"] .glow.a { right: auto; left: -30vmax; }
  html[dir="rtl"] .glow.b { left: auto; right: -35vmax; }
  @keyframes drift-a-rtl { to { transform: translate(6vmax, 5vmax) scale(1.08); } }
  @keyframes drift-b-rtl { to { transform: translate(-5vmax, -4vmax) scale(1.1); } }
  html[dir="rtl"] .slide.shown .glow.a { animation-name: drift-a-rtl; }
  html[dir="rtl"] .slide.shown .glow.b { animation-name: drift-b-rtl; }
  @media (orientation: landscape) {
    /* The headline column keeps its wide margin on the side the clock is on, now the left. A column
       narrower than the screen stays against the right edge. */
    html[dir="rtl"] .content { left: calc(var(--unit) * 14); right: calc(var(--unit) * 5); }
    html[dir="rtl"] .content.multi { left: calc(var(--unit) * 5); right: calc(var(--unit) * 5); }
  }
  html[dir="rtl"] .meta span + span::before { margin-right: 0; margin-left: calc(var(--unit) * 1.2); }
  html[dir="rtl"] .coverage { padding-left: 0; border-left: 0; padding-right: calc(var(--unit) * 1.6); border-right: 3px solid var(--faint); }
  html[dir="rtl"] .clock { text-align: left; }
  /* A time such as 9:00 PM is Latin text. Isolated, it keeps its own order instead of reading PM 9:00. */
  html[dir="rtl"] .clock .time { direction: ltr; unicode-bidi: isolate; }
  html[dir="rtl"] .brand, html[dir="rtl"] .brand small, html[dir="rtl"] .meta, html[dir="rtl"] h1 { letter-spacing: 0; }
</style>
</head>
<body>
<div id="slides"></div>
<div class="top">
  <div class="brand"><span class="mark"><i></i><i></i><i></i></span><span><span id="heading">Headlines</span> <small id="source">from Google News</small></span></div>
  <div class="clock" id="clock" hidden><div class="time" id="time"></div><div class="date" id="date"></div></div>
</div>
<div class="progress" id="progress"></div>
<script id="gn-data" type="application/json">__GN_DATA__</script>
<script>
(function () {
  'use strict';
  var data;
  try { data = JSON.parse(document.getElementById('gn-data').textContent); } catch (e) { data = null; }
  if (!data || typeof data !== 'object') data = { stories: [], options: {}, updated: 0, error: null };
  var options = data.options || {};
  var stories = data.stories || [];
  var seconds = Math.max(5, Number(options.secondsPerStory) || 12);
  document.documentElement.style.setProperty('--duration', seconds + 's');
  if (options.language) document.documentElement.lang = options.language;

  // Hebrew editions read right to left and use Hebrew labels. Every other edition keeps the English ones.
  var lang = String(options.language || 'en').toLowerCase();
  var he = lang === 'he' || lang === 'iw' || lang.indexOf('he-') === 0;
  if (he) document.documentElement.dir = 'rtl';
  // A name that starts with a Hebrew letter takes the "and" prefix directly, any other with a hyphen.
  function vav(name) { return (/^[\u0590-\u05ff]/.test(name) ? '\u05d5' : '\u05d5-\u2060') + name; }
  var L = he ? {
    from: '\u05de\u05ea\u05d5\u05da \u05d7\u05d3\u05e9\u05d5\u05ea Google',
    offline: function (time) { return '\u05de\u05ea\u05d5\u05da \u05d7\u05d3\u05e9\u05d5\u05ea Google \u00b7 \u05d0\u05d9\u05df \u05d7\u05d9\u05d1\u05d5\u05e8, \u05e2\u05d3\u05db\u05d5\u05df \u05d0\u05d7\u05e8\u05d5\u05df ' + time; },
    loading: '\u05d8\u05d5\u05e2\u05df \u05db\u05d5\u05ea\u05e8\u05d5\u05ea\u2026',
    failed: function () { return '\u05d0\u05d9\u05df \u05d7\u05d9\u05d1\u05d5\u05e8 \u05dc\u05d7\u05d3\u05e9\u05d5\u05ea Google. \u05de\u05e0\u05e1\u05d4 \u05e9\u05d5\u05d1 \u05d1\u05e7\u05e8\u05d5\u05d1.'; },
    none: function (heading) { return '\u05d0\u05d9\u05df \u05db\u05e8\u05d2\u05e2 \u05db\u05ea\u05d1\u05d5\u05ea \u05e2\u05d1\u05d5\u05e8 ' + heading; },
    now: '\u05d4\u05e8\u05d2\u05e2',
    minutes: function (n) { return n === 1 ? '\u05dc\u05e4\u05e0\u05d9 \u05d3\u05e7\u05d4' : '\u05dc\u05e4\u05e0\u05d9 ' + n + ' \u05d3\u05e7\u05d5\u05ea'; },
    hours: function (n) { return n === 1 ? '\u05dc\u05e4\u05e0\u05d9 \u05e9\u05e2\u05d4' : n === 2 ? '\u05dc\u05e4\u05e0\u05d9 \u05e9\u05e2\u05ea\u05d9\u05d9\u05dd' : '\u05dc\u05e4\u05e0\u05d9 ' + n + ' \u05e9\u05e2\u05d5\u05ea'; },
    days: function (n) { return n === 1 ? '\u05dc\u05e4\u05e0\u05d9 \u05d9\u05d5\u05dd' : n === 2 ? '\u05dc\u05e4\u05e0\u05d9 \u05d9\u05d5\u05de\u05d9\u05d9\u05dd' : '\u05dc\u05e4\u05e0\u05d9 ' + n + ' \u05d9\u05de\u05d9\u05dd'; },
    also: '\u05de\u05e7\u05d5\u05e8\u05d5\u05ea \u05e0\u05d5\u05e1\u05e4\u05d9\u05dd: ',
    names: function (others) {
      var named = others.slice(0, 4);
      if (others.length > 4) return named.join(', ') + ' \u05d5\u05e2\u05d5\u05d3 ' + (others.length - 4);
      if (named.length === 1) return named[0];
      return named.slice(0, -1).join(', ') + ' ' + vav(named[named.length - 1]);
    },
    date: 'he-IL',
    sections: {
      'Top stories': '\u05d4\u05db\u05ea\u05d1\u05d5\u05ea \u05d4\u05de\u05d5\u05d1\u05d9\u05dc\u05d5\u05ea',
      'World': '\u05d1\u05e2\u05d5\u05dc\u05dd',
      'Your country': '\u05d1\u05d0\u05e8\u05e5',
      'Business': '\u05e2\u05e1\u05e7\u05d9\u05dd',
      'Technology': '\u05d8\u05db\u05e0\u05d5\u05dc\u05d5\u05d2\u05d9\u05d4',
      'Entertainment': '\u05d1\u05d9\u05d3\u05d5\u05e8',
      'Sport': '\u05e1\u05e4\u05d5\u05e8\u05d8',
      'Science': '\u05de\u05d3\u05e2',
      'Health': '\u05d1\u05e8\u05d9\u05d0\u05d5\u05ea'
    }
  } : {
    from: 'from Google News',
    offline: function (time) { return 'from Google News \u00b7 offline, last update ' + time; },
    loading: 'Loading headlines\u2026',
    failed: function (error) { return error + '. Trying again soon.'; },
    none: function (heading) { return 'No stories match ' + heading + ' right now.'; },
    now: 'Just now',
    minutes: function (n) { return n + ' min ago'; },
    hours: function (n) { return n + (n === 1 ? ' hour ago' : ' hours ago'); },
    days: function (n) { return n + (n === 1 ? ' day ago' : ' days ago'); },
    also: 'Also covered by ',
    names: function (others) {
      var named = others.slice(0, 4);
      if (others.length > 4) named.push(others.length - 4 + ' more');
      return list(named);
    },
    date: [],
    sections: {}
  };
  document.getElementById('source').textContent = L.from;

  // Base, first glow and second glow for each slide, in turn.
  var palettes = [
    ['#0c1424', '#2f5fd0', '#18a3a3'],
    ['#1a0f1f', '#b03a6b', '#5b3fc4'],
    ['#0b1a17', '#1f9d6b', '#2a6fc9'],
    ['#1d130b', '#d0752f', '#b8323f'],
    ['#10111f', '#6046d6', '#d04a8a'],
    ['#0a171d', '#2390b8', '#3ab87a'],
    ['#1c0d0e', '#c4423a', '#d49a2a']
  ];

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function ago(date) {
    var t = Date.parse(date);
    if (!t) return null;
    var minutes = Math.round((Date.now() - t) / 60000);
    if (minutes < 1) return L.now;
    if (minutes < 60) return L.minutes(minutes);
    var hours = Math.round(minutes / 60);
    if (hours < 24) return L.hours(hours);
    return L.days(Math.round(hours / 24));
  }

  function list(names) {
    if (names.length === 1) return names[0];
    return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  }

  var heading = options.heading || 'Top stories';
  heading = L.sections[heading] || heading;
  document.getElementById('heading').textContent = heading + (options.edition ? ' · ' + options.edition : '');

  // The clock follows the kiosk's own locale and 12 or 24 hour preference.
  if (options.showClock !== false) {
    var clock = document.getElementById('clock');
    clock.hidden = false;
    var tick = function () {
      var now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString(L.date, { weekday: 'long', month: 'long', day: 'numeric' });
    };
    tick();
    setInterval(tick, 1000 * 15);
  }

  var root = document.getElementById('slides');
  if (!stories.length) {
    var notice = el('div', 'notice');
    var mark = el('span', 'mark');
    for (var k = 0; k < 3; k++) mark.appendChild(el('i'));
    notice.appendChild(mark);
    var message = data.error ? L.failed(data.error)
      : data.updated ? L.none(heading) : L.loading;
    notice.appendChild(el('div', data.error ? 'stale' : null, message));
    root.appendChild(notice);
    return;
  }
  if (data.error) {
    document.getElementById('source').textContent = L.offline(
      new Date(data.updated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    document.getElementById('source').className = 'stale';
  }

  function item(story) {
    var content = el('div', 'item');
    if (story.source) {
      var outlet = el('div', 'outlet');
      if (story.logo) {
        var logo = el('img');
        logo.src = story.logo;
        logo.alt = '';
        outlet.appendChild(logo);
      } else {
        outlet.appendChild(el('span', 'initial', story.source.charAt(0).toUpperCase()));
      }
      outlet.appendChild(el('span', null, story.source));
      content.appendChild(outlet);
    }
    content.appendChild(el('h1', null, story.title));
    var meta = el('div', 'meta');
    var when = el('span', 'when', ago(story.start));
    when._start = story.start;
    if (when.textContent) meta.appendChild(when);
    if (meta.firstChild) content.appendChild(meta);
    var others = story.outlets || [];
    if (options.showCoverage !== false && others.length) {
      var coverage = el('p', 'coverage');
      coverage.appendChild(document.createTextNode(L.also));
      coverage.appendChild(el('b', null, L.names(others)));
      content.appendChild(coverage);
    }
    return content;
  }

  // Each screen shows one to four headlines, in feed order.
  var perScreen = Math.max(1, Math.min(4, Math.round(Number(options.perScreen) || 1)));
  var screens = [];
  for (var s = 0; s < stories.length; s += perScreen) screens.push(stories.slice(s, s + perScreen));
  var short = screens[screens.length - 1];
  if (screens.length > 1) for (var t = 0; short.length < perScreen; t++) short.push(stories[t]);

  var slides = screens.map(function (group, n) {
    var slide = el('div', 'slide');
    var colours = palettes[n % palettes.length];
    slide.style.setProperty('--base', colours[0]);
    slide.style.setProperty('--a', colours[1]);
    slide.style.setProperty('--b', colours[2]);
    slide.appendChild(el('div', 'glow a'));
    slide.appendChild(el('div', 'glow b'));
    var content = el('div', perScreen > 1 ? 'content multi n' + perScreen : 'content');
    group.forEach(function (story) { content.appendChild(item(story)); });
    slide.appendChild(content);
    root.appendChild(slide);
    return slide;
  });

  // Find the largest text scale at which a screen's headlines fit, none of them cut off.
  function fits(content) {
    var box = content.getBoundingClientRect();
    if (content.firstChild.getBoundingClientRect().top < box.top - 1) return false;
    if (content.lastChild.getBoundingClientRect().bottom > box.bottom + 1) return false;
    var heads = content.querySelectorAll('h1');
    for (var i = 0; i < heads.length; i++) {
      // A cut-off headline hides a whole line. Big letters overhang their box by a few pixels, which is fine.
      var line = parseFloat(getComputedStyle(heads[i]).lineHeight) || 0;
      if (heads[i].scrollHeight > heads[i].clientHeight + line / 2) return false;
      // A long word mustn't run off the side either.
      if (heads[i].scrollWidth > heads[i].clientWidth + 1) return false;
    }
    return true;
  }
  function fit(content) {
    var low = 0.5, high = 2.4;
    content.style.setProperty('--fit', high);
    if (fits(content)) return;
    for (var step = 0; step < 9; step++) {
      var mid = (low + high) / 2;
      content.style.setProperty('--fit', mid);
      if (fits(content)) low = mid; else high = mid;
    }
    content.style.setProperty('--fit', low);
  }
  function fitAll() {
    Array.prototype.forEach.call(document.querySelectorAll('.content'), fit);
  }
  fitAll();
  window.addEventListener('resize', fitAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

  var progress = document.getElementById('progress');
  var bars = slides.length > 1 ? slides.map(function () {
    var bar = el('div');
    bar.appendChild(el('i'));
    progress.appendChild(bar);
    return bar;
  }) : [];

  var index = -1;
  function restart(node) { node.style.animation = 'none'; void node.offsetWidth; node.style.animation = ''; }
  function show(next) {
    if (index >= 0) slides[index].classList.remove('shown');
    index = next;
    var slide = slides[index];
    Array.prototype.forEach.call(slide.querySelectorAll('.when'), function (when) {
      when.textContent = ago(when._start) || '';
    });
    Array.prototype.forEach.call(slide.querySelectorAll('.glow'), restart);
    slide.classList.add('shown');
    bars.forEach(function (bar, i) {
      bar.className = i < index ? 'done' : '';
      restart(bar.firstChild);
      if (i === index) bar.className = 'now';
    });
  }
  show(0);
  if (slides.length > 1) setInterval(function () { show((index + 1) % slides.length); }, seconds * 1000);
})();
</script>
</body>
</html>
